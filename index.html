<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Chronostasis</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#04060b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#04060b;color:#dffaff;overflow:hidden;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;font-family:"Segoe UI",Roboto,system-ui,sans-serif}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#ui{position:fixed;inset:0;pointer-events:none;z-index:5}
.b{position:absolute;pointer-events:auto;border-radius:50%;border:2px solid rgba(94,242,255,.55);background:rgba(4,20,30,.38);color:#bff8ff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;letter-spacing:.04em;font-size:max(9px,2.4vh);text-align:center;line-height:1.05;touch-action:none}
.b i{font-style:normal;font-size:max(14px,5vh);line-height:1}
.b.on{background:rgba(94,242,255,.38);border-color:#fff}
#dpad{left:calc(3vw + env(safe-area-inset-left));bottom:5vh;width:46vh;height:22vh;border-radius:12vh;flex-direction:row;justify-content:space-between;padding:0 4vh}
#dpad i{font-size:max(18px,8vh);opacity:.8}
#dpad.l i:first-child,#dpad.r i:last-child{opacity:1;color:#fff}
#bJump{right:calc(3vw + env(safe-area-inset-right));bottom:5vh;width:20vh;height:20vh}
#bFire{right:calc(3vw + 22vh);bottom:4vh;width:17vh;height:17vh}
#bBub{right:calc(3vw + 3vh);bottom:27vh;width:16vh;height:16vh}
#bRel{right:calc(3vw + 21vh);bottom:23vh;width:15vh;height:15vh}
#bOc{right:calc(3vw + 40vh);bottom:9vh;width:15vh;height:15vh;border-color:rgba(255,179,71,.7);color:#ffd9a0}
#bPause{top:2vh;right:calc(2vw + env(safe-area-inset-right));width:9vh;height:9vh;font-size:max(12px,3.4vh)}
body.noctl #ui .b{display:none}
.ov{position:fixed;inset:0;z-index:10;display:none;align-items:center;justify-content:center;text-align:center;background:radial-gradient(ellipse at center,rgba(2,6,12,.3),rgba(2,4,8,.9));pointer-events:auto}
.ov.show{display:flex}
h1{font-size:min(12vh,9vw);letter-spacing:.26em;margin:0 0 1vh .26em;font-weight:800;color:#e9fdff;text-shadow:0 0 24px rgba(94,242,255,.8),0 0 60px rgba(94,242,255,.35)}
h2{font-size:min(8vh,7vw);letter-spacing:.2em;margin:0 0 1.5vh;color:#e9fdff;text-shadow:0 0 20px rgba(94,242,255,.7)}
.tag{margin:0 0 4vh;font-size:max(12px,3.6vh);letter-spacing:.3em;color:#8fdcea;text-transform:uppercase}
.small{font-size:max(10px,2.6vh);color:#6fa6b3;margin:2vh 0 0;line-height:1.5}
button.big{pointer-events:auto;background:rgba(94,242,255,.12);border:1.5px solid #5ef2ff;color:#dffaff;padding:1.6vh 4vh;font-size:max(12px,3.4vh);letter-spacing:.22em;border-radius:3px;margin:.8vh;font-weight:700;font-family:inherit}
button.big:active{background:rgba(94,242,255,.4)}
button.big[hidden]{display:none}
#rot{position:fixed;inset:0;z-index:30;background:#04060b;display:none;align-items:center;justify-content:center;text-align:center;font-size:20px;letter-spacing:.2em;color:#5ef2ff;padding:30px}
#rot.show{display:flex}
</style>
</head>
<body class="noctl">
<canvas id="c"></canvas>
<div id="ui">
 <div id="dpad" class="b"><i>◀</i><i>▶</i></div>
 <div id="bJump" class="b" data-k="jump"><i>▲</i>JUMP</div>
 <div id="bFire" class="b" data-k="fire"><i>⌁</i>SPIKE</div>
 <div id="bBub" class="b" data-k="bubble"><i>◯</i>THAW</div>
 <div id="bRel" class="b" data-k="release"><i>≫</i>VOLLEY</div>
 <div id="bOc" class="b" data-k="oc"><i>⧖</i>OVERCLOCK</div>
 <div id="bPause" class="b" data-k="pause">II</div>
</div>
<div id="title" class="ov show"><div>
 <h1>CHRONOSTASIS</h1>
 <p class="tag">The world didn't end. It paused.</p>
 <div><button class="big" id="bStart">BEGIN</button></div>
 <div><button class="big" id="bFull">FULLSCREEN</button><button class="big" id="bInstall" hidden>INSTALL</button></div>
 <p class="small">Best played in landscape · Headphones recommended</p>
</div></div>
<div id="pause" class="ov"><div>
 <h2>PAUSED</h2>
 <div><button class="big" id="pResume">RESUME</button></div>
 <div><button class="big" id="pVoice">VOICE: ON</button><button class="big" id="pSound">SOUND: ON</button></div>
 <div><button class="big" id="pRestart">RESTART</button></div>
</div></div>
<div id="end" class="ov"><div>
 <h2>CHAPTER 1 COMPLETE</h2>
 <p class="tag">The Freeze is not a disaster. It is a decision.</p>
 <p class="small" id="endStats"></p>
 <div><button class="big" id="eReplay">PLAY AGAIN</button></div>
</div></div>
<div id="rot">ROTATE YOUR PHONE<br>TO LANDSCAPE</div>
<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const rnd=(a,b)=>a+Math.random()*(b-a);
const approach=(v,t,a)=>v<t?Math.min(v+a,t):Math.max(v-a,t);
const d2=(ax,ay,bx,by)=>(ax-bx)*(ax-bx)+(ay-by)*(ay-by);
function hash(n){n=(n^61)^(n>>>16);n=n+(n<<3);n=n^(n>>>4);n=Math.imul(n,0x27d4eb2d);n=n^(n>>>15);return (n>>>0)/4294967296}
function seeded(seed){return()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}}

const cv=$('c'),ctx=cv.getContext('2d');
const H=360;let W=780,scale=1,dpr=1;
function resize(){
  dpr=Math.min(window.devicePixelRatio||1,2.5);
  const cw=window.innerWidth,ch=window.innerHeight;
  scale=ch/H;W=Math.max(300,cw/scale);
  cv.width=Math.round(cw*dpr);cv.height=Math.round(ch*dpr);
  const rot=$('rot');if(rot)rot.classList.toggle('show',ch>cw*1.05);
}
window.addEventListener('resize',resize);

/* ---------------- AUDIO ---------------- */
const A={ctx:null,master:null,on:true,voice:true,hum:null,rumble:null,
 init(){
  if(this.ctx){if(this.ctx.state==='suspended')this.ctx.resume();return}
  try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;
   this.ctx=new C();this.master=this.ctx.createGain();this.master.gain.value=this.on?.55:0;this.master.connect(this.ctx.destination);this.ambient();
  }catch(e){}
 },
 ambient(){
  const c=this.ctx,lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=180;
  const g=c.createGain();g.gain.value=.07;
  [55,55.4,82.6].forEach(f=>{const o=c.createOscillator();o.type='sawtooth';o.frequency.value=f;o.connect(lp);o.start()});
  lp.connect(g);g.connect(this.master);
  const r=c.createOscillator();r.type='sine';r.frequency.value=34;const rg=c.createGain();rg.gain.value=0;r.connect(rg);rg.connect(this.master);r.start();this.rumble=rg;
  const h=c.createOscillator();h.type='triangle';h.frequency.value=70;const hg=c.createGain();hg.gain.value=0;h.connect(hg);hg.connect(this.master);h.start();this.hum=hg;
 },
 setOn(v){this.on=v;if(this.master)this.master.gain.value=v?.55:0},
 tone(f,d,type,v,to,delay){
  if(!this.ctx||!this.on)return;
  const c=this.ctx,t=c.currentTime+(delay||0),o=c.createOscillator(),g=c.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);
  if(to)o.frequency.exponentialRampToValueAtTime(Math.max(20,to),t+d);
  g.gain.setValueAtTime(v||.1,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g);g.connect(this.master);o.start(t);o.stop(t+d+.03);
 },
 noise(d,v,f,delay){
  if(!this.ctx||!this.on)return;
  const c=this.ctx,t=c.currentTime+(delay||0),n=Math.max(1,Math.floor(c.sampleRate*d));
  const buf=c.createBuffer(1,n,c.sampleRate),dat=buf.getChannelData(0);
  for(let i=0;i<n;i++)dat[i]=(Math.random()*2-1)*(1-i/n);
  const s=c.createBufferSource();s.buffer=buf;
  const lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=f||2000;
  const g=c.createGain();g.gain.value=v||.1;s.connect(lp);lp.connect(g);g.connect(this.master);s.start(t);
 },
 setWall(x){if(this.rumble)this.rumble.gain.value=x*.14},
 fire(){this.tone(1000,.12,'sawtooth',.05,300);this.noise(.05,.04,3000)},
 jump(){this.tone(260,.12,'square',.03,480)},
 land(){this.noise(.08,.05,500)},
 freeze(){this.tone(1500,.25,'sine',.05,500);this.tone(2200,.2,'sine',.03,900,.04)},
 bubble(){this.tone(180,.4,'sine',.1,700);this.tone(900,.3,'triangle',.04,1800,.05)},
 bubbleOff(){this.tone(700,.3,'sine',.07,150)},
 volley(){for(let i=0;i<6;i++)this.tone(1400-i*80,.1,'sawtooth',.045,300,i*.05)},
 hit(){this.noise(.06,.06,2500);this.tone(500,.06,'square',.03,250)},
 boom(){this.noise(.4,.18,900);this.tone(120,.35,'sawtooth',.1,40)},
 pick(){this.tone(700,.1,'sine',.07);this.tone(1050,.16,'sine',.07,null,.08)},
 cp(){this.tone(440,.15,'triangle',.07);this.tone(660,.15,'triangle',.07,null,.1);this.tone(880,.25,'triangle',.07,null,.2)},
 hurt(){this.noise(.18,.14,1200);this.tone(200,.2,'sawtooth',.08,70)},
 die(){this.noise(.8,.14,600);this.tone(400,.9,'sine',.1,40)},
 log(){this.tone(900,.05,'square',.03);this.tone(1200,.05,'square',.03,null,.07);this.tone(900,.05,'square',.03,null,.14)},
 lock(){this.tone(2000,.5,'sine',.03,300)},
 tele(){this.tone(1800,.15,'sawtooth',.04,200)},
 ocOn(){this.tone(500,.5,'sawtooth',.07,60);if(this.hum)this.hum.gain.value=.12},
 ocOff(){this.tone(100,.4,'sawtooth',.06,600);if(this.hum)this.hum.gain.value=0},
 speak(t,who){
  if(!this.voice||!('speechSynthesis' in window))return;
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.rate=.92;
   u.pitch=who==='ILYR'?.65:who==='KAELEN'?.85:.5;u.volume=.9;speechSynthesis.speak(u)}catch(e){}
 },
 hush(){try{if('speechSynthesis' in window)speechSynthesis.cancel()}catch(e){}}
};

/* ---------------- INPUT ---------------- */
const K={left:0,right:0,jump:0,fire:0};
const E={jump:false,bubble:false,release:false,oc:false};
let state='title';
function press(k,v){
  if(k==='jump'){if(v&&!K.jump)E.jump=true;K.jump=v?1:0}
  else if(k==='fire')K.fire=v?1:0;
  else if(k==='left'||k==='right')K[k]=v?1:0;
  else if(v)E[k]=true;
}
document.querySelectorAll('[data-k]').forEach(b=>{
  const k=b.dataset.k;
  const dn=e=>{e.preventDefault();b.classList.add('on');if(k==='pause'){togglePause();return}press(k,1);try{b.setPointerCapture(e.pointerId)}catch(_){}};
  const up=e=>{e.preventDefault();b.classList.remove('on');if(k!=='pause')press(k,0)};
  b.addEventListener('pointerdown',dn);b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up);
});
const dp=$('dpad');let dpId=null;
function dpSet(e){const r=dp.getBoundingClientRect();const x=(e.clientX-r.left)/r.width;K.left=x<.5?1:0;K.right=x>=.5?1:0;dp.classList.toggle('l',!!K.left);dp.classList.toggle('r',!!K.right)}
dp.addEventListener('pointerdown',e=>{e.preventDefault();dpId=e.pointerId;try{dp.setPointerCapture(e.pointerId)}catch(_){}dpSet(e)});
dp.addEventListener('pointermove',e=>{if(e.pointerId===dpId)dpSet(e)});
const dpUp=e=>{if(e.pointerId===dpId){dpId=null;K.left=K.right=0;dp.classList.remove('l');dp.classList.remove('r')}};
dp.addEventListener('pointerup',dpUp);dp.addEventListener('pointercancel',dpUp);
const KEYS={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',ArrowUp:'jump',KeyW:'jump',Space:'jump',KeyJ:'fire',KeyZ:'fire',KeyK:'bubble',KeyX:'bubble',KeyL:'release',KeyC:'release',ShiftLeft:'oc',ShiftRight:'oc',KeyO:'oc'};
window.addEventListener('keydown',e=>{
  if(e.code==='KeyP'||e.code==='Escape'){togglePause();return}
  if(state==='scene'&&(e.code==='Space'||e.code==='Enter')){e.preventDefault();advance();return}
  const k=KEYS[e.code];if(!k)return;e.preventDefault();if(e.repeat)return;press(k,1);
});
window.addEventListener('keyup',e=>{const k=KEYS[e.code];if(k)press(k,0)});
window.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('pointerdown',e=>{e.preventDefault();if(state==='scene')advance()});
window.addEventListener('blur',()=>{if(state==='play')togglePause()});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='play')togglePause()});

/* ---------------- WORLD ---------------- */
const GRAV=950,JUMP_V=-415,RUN=148,GROUND=600,WORLD_W=6500,WORLD_H=780,KILL_Y=790,STEP=1/60;
let P,S,T,B,cam,L,BOSS,ENS=[];
let drones,turrets,bullets,spikes,debris,parts,pickups,arts,cps,hints,statues,deco,spawners;
let wallX=-340,cpSave,shake=0,time=0,camOverride=null,deathMsg='';
let toastT=0,toastTxt='',logT=0,logTxt='',logWho='',hintTxt='',hintA=0,CS=null;
const maxHp=()=>100-S.burn;

const LOGS=[
 {x:430,y:GROUND-30,who:'COMMUTER',t:'The board said ten minutes. Ten minutes! Why isn\'t the train moving? Why isn\'t anyone... why can\'t I blink?'},
 {x:1190,y:GROUND-170,who:'BUREAU ENGINEER',t:'Allocation memo. Sector Nine is flagged low yield. Route the leading edge east. Do not announce it.'},
 {x:2520,y:GROUND-30,who:'CHILD',t:'Mama, the clock stopped. I can still see the bird. It is not flying anymore. Mama?'},
 {x:3190,y:GROUND-30,who:'SURVEYOR',t:'Day four hundred at the border. On this side the rain falls. On the other, it hangs. We are not being swallowed. We are being aimed at.'},
 {x:4700,y:380-30,who:'SERVER RACK',t:'Compression at ninety-one percent. Archive priority: Enclave Alpha. Everyone else is classified as overflow.'},
 {x:5290,y:GROUND-30,who:'ILYR SOL',t:'If you can hear this, you are him. Come to the tower. I will explain the reflex test.'}
];

function buildLevel(){
  const G=GROUND;
  L={
   solids:[
    {x:-300,y:G,w:2300,h:200},{x:2270,y:G,w:1450,h:200},{x:4420,y:380,w:700,h:400},{x:5100,y:G,w:1500,h:200},
    {x:620,y:G-30,w:40,h:30},{x:690,y:G-50,w:46,h:50},{x:1360,y:G-40,w:44,h:40},{x:1620,y:G-52,w:48,h:52},{x:2850,y:G-36,w:50,h:36},
    {x:3370,y:430,w:50,h:14},{x:3470,y:390,w:50,h:14},{x:3570,y:430,w:50,h:14},{x:3670,y:390,w:50,h:14},
    {x:6460,y:0,w:40,h:G}
   ],
   oneways:[
    {x:820,y:G-70,w:90},{x:960,y:G-110,w:90},{x:1100,y:G-150,w:100},
    {x:3790,y:550,w:80},{x:3910,y:505,w:70},{x:4020,y:465,w:70},{x:4130,y:430,w:70},{x:4240,y:400,w:70},{x:4340,y:385,w:60},
    {x:5650,y:510,w:100},{x:6000,y:480,w:110}
   ]};
  const dr=(x,y)=>({kind:'drone',x,y,hx:x,hy:y,r:13,hp:3,max:3,cd:rnd(.8,1.8),t:rnd(0,6),hit:0,fz:false});
  drones=[dr(1250,520),dr(1500,500),dr(1720,535),dr(2720,510),dr(2930,490),dr(4600,300),dr(4820,310),dr(5000,300)];
  const tu=(x,y)=>({kind:'turret',x,y,r:14,hp:6,max:6,cd:rnd(.3,1),burst:0,hit:0,fz:false,ang:0});
  turrets=[tu(3395,420),tu(3495,380),tu(3595,420),tu(3695,380),tu(4950,360)];
  bullets=[];spikes=[];debris=[];parts=[];
  pickups=[{x:1140,y:G-175,got:false},{x:3300,y:G-14,got:false},{x:4900,y:366,got:false},{x:5260,y:G-14,got:false}];
  arts=LOGS.map((l,i)=>({x:l.x,y:l.y,i,got:false}));
  cps=[{x:90},{x:900},{x:2290},{x:3290},{x:3690},{x:4450},{x:5250}].map((c,i)=>({x:c.x,y:(i===5?380:G)-26,on:i===0,i}));
  hints=[
   {x1:40,x2:330,t:'MOVE ◀ ▶   ·   JUMP ▲ (hold to go higher)'},
   {x1:330,x2:600,t:'Touch glowing ARTIFACTS to hear frozen audio logs'},
   {x1:1000,x2:1280,t:'SPIKE ⌁ throws a time spike. It auto-aims at nearby enemies'},
   {x1:1380,x2:1600,t:'THAW ◯ opens a bubble that freezes enemies and bullets. Spikes thrown in stay frozen. VOLLEY ≫ fires them all'},
   {x1:1860,x2:2000,t:'Stand at the edge. Open THAW and let falling debris freeze into a bridge'},
   {x1:3200,x2:3360,t:'OVERCLOCK ⧖ slows the world but burns your max health. Spend it wisely'},
   {x1:4440,x2:4560,t:'Cell capsules heal you and repair some lifespan'}
  ];
  spawners=[{x1:2000,x2:2270,lanes:[2072,2136],t:0,k:0,period:1.3,y:330}];
  statues=[];const r=seeded(77);
  const addS=(x1,x2,n)=>{for(let i=0;i<n;i++)statues.push({x:x1+(x2-x1)*(i+r())/n,y:G,f:r()<.5?-1:1,pose:Math.floor(r()*5),k:r()})};
  addS(150,2000,16);addS(2300,3300,12);addS(5150,5600,3);
  statues.push({x:5340,y:G,f:-1,pose:-1,k:.5,clone:true});
  deco=[];
  for(let i=0;i<70;i++)deco.push({x:r()*WORLD_W,y:80+r()*420,t:r()<.45?'bird':'shard',s:4+r()*14,rot:r()*6});
  BOSS={kind:'boss',x:6150,y:G,w:16,h:38,r:20,hp:14,max:14,active:false,done:false,face:-1,t:0,state:'wait',cd:1,atk:0,flash:0,hit:0,fz:false};
}
const ANCH=[{x:5760,y:GROUND},{x:5900,y:GROUND},{x:6200,y:GROUND},{x:5700,y:510},{x:6055,y:480}];

function newGame(){
  buildLevel();
  P={x:90,y:GROUND-26,w:13,h:26,vx:0,vy:0,face:1,onG:true,coy:0,buf:0,hp:100,inv:0,fireCd:0,anim:0,dead:0,trail:[],lastGY:GROUND,tt:0};
  S={burn:0,chrono:100,weeks:0,art:0,time:0,deaths:0};
  T={ts:1,oc:false};
  B={on:false,x:0,y:0,r:100,floorY:GROUND,stored:0,t:0,pulse:0};
  cam={x:-100,y:GROUND-224};wallX=-340;cpSave={x:90,y:GROUND-26,burn:0,i:0};
  shake=0;camOverride=null;
}

/* ---------------- helpers ---------------- */
function burst(x,y,n,col,spd,life,g){
  for(let i=0;i<n&&parts.length<700;i++){const a=Math.random()*6.283,s=Math.random()*spd;
   parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:life*(.5+Math.random()*.5),max:life,c:col,s:1+Math.random()*2.2,g:g||0})}
}
function toast(t,d){toastTxt=t;toastT=d||2.4}
function showLog(who,t,d){logWho=who;logTxt=t;logT=d||7;A.log();A.speak(t,who)}
function solidAt(x,y){for(const s of L.solids)if(x>s.x&&x<s.x+s.w&&y>s.y&&y<s.y+s.h)return true;return false}
function ov(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
function platforms(){const o=L.oneways.slice();for(const d of debris)if(d.fz)o.push(d);return o}
function cyOf(e){return e.kind==='boss'?e.y-e.h/2:e.y}
function allEnemies(){const a=[];for(const d of drones)if(d.hp>0)a.push(d);for(const t of turrets)if(t.hp>0)a.push(t);if(BOSS.active&&!BOSS.done)a.push(BOSS);return a}

function moveBody(p,dt){
  p.x+=p.vx*dt;
  for(const s of L.solids)if(ov(p,s)){if(p.vx>0)p.x=s.x-p.w;else if(p.vx<0)p.x=s.x+s.w;p.vx=0}
  const pb=p.y+p.h,was=p.onG,vy0=p.vy;
  p.y+=p.vy*dt;p.onG=false;
  for(const s of L.solids)if(ov(p,s)){if(p.vy>0){p.y=s.y-p.h;p.vy=0;p.onG=true}else if(p.vy<0){p.y=s.y+s.h;p.vy=0}}
  if(p.vy>=0)for(const o of platforms()){

function toggleBubble(){

function aimTarget(){
  let best=null,bd=1e9;const px=P.x+P.w/2,py=P.y+8;

function shoot(){

/* ---------------- update ---------------- */
function updatePlayer(dt){
  const p=P;
  if(p.dead>0){p.dead-=dt;if(p.dead<=0)respawn();return}
  p.inv=Math.max(0,p.inv-dt);p.fireCd-=dt;
  const dir=K.right-K.left;
  p.vx=approach(p.vx,dir*RUN,(p.onG?2200:1300)*dt);
  if(dir)p.face=dir;
  p.coy=p.onG?.1:p.coy-dt;
  if(E.jump){p.buf=.13;E.jump=false}
  p.buf-=dt;
  if(p.buf>0&&p.coy>0){p.vy=JUMP_V;p.buf=0;p.coy=0;p.onG=false;A.jump();burst(p.x+6,p.y+26,4,'#8fdcea',50,.25,0)}
  p.vy+=GRAV*dt*((!K.jump&&p.vy<0)?2.2:1);
  if(p.vy>740)p.vy=740;
  moveBody(p,dt);
  p.anim+=Math.abs(p.vx)*dt*.12;
  if(T.oc){p.tt-=dt;if(p.tt<=0){p.tt=.035;p.trail.push({x:p.x,y:p.y,f:p.face});if(p.trail.length>7)p.trail.shift()}}
  else if(p.trail.length)p.trail.shift();
  if(p.y>KILL_Y)die('void');
  if(K.fire&&p.fireCd<=0&&p.dead<=0)shoot();
}
function updateBubble(dt){
  B.t+=dt;B.pulse=Math.max(0,B.pulse-dt*2);
  if(B.on){S.chrono-=5*dt;if(S.chrono<=0){S.chrono=0;toast('CHRONO DEPLETED');endBubble()}}
  else S.chrono=Math.min(100,S.chrono+14*dt);
}
function updBullets(dw){
  for(const b of bullets){
    if(!B.on)b.fr=false;
    else if(!b.fr&&d2(b.x,b.y,B.x,B.y)<(B.r-4)*(B.r-4)){b.fr=true;A.freeze()}
    if(b.fr)continue;
    if(b.lock){
      b.lt+=dw;
      if(b.lt<.6){const k=1-b.lt/.6;b.x+=b.vx*dw*k;b.y+=b.vy*dw*k}
      else if(b.lt>=2){b.lock=false;const dx=P.x+P.w/2-b.x,dy=P.y+13-b.y,d=Math.hypot(dx,dy)||1;b.vx=dx/d*205;b.vy=dy/d*205;b.life=6}
      continue;
    }
    b.x+=b.vx*dw;b.y+=b.vy*dw;b.life-=dw;
    if(b.life<=0||solidAt(b.x,b.y)){b.dead=true;continue}
    if(P.dead<=0&&d2(b.x,b.y,P.x+P.w/2,P.y+13)<10*10){hurt(12);b.dead=true}
  }
  bullets=bullets.filter(b=>!b.dead);
}
function updSpikes(dt){
  for(const s of spikes){
    if(s.dead)continue;
    if(s.stored){s.t=(s.t||0)+dt;continue}
    if(s.wait>0){s.wait-=dt;if(s.wait<=0)launch(s);else continue}
    if(s.home&&s.tg&&(s.tg.hp>0||s.tg===BOSS&&BOSS.active)){
      const dx=s.tg.x-s.x,dy=cyOf(s.tg)-s.y,d=Math.hypot(dx,dy)||1;
      const nx=s.vx/s.spd+(dx/d-s.vx/s.spd)*Math.min(1,dt*9),ny=s.vy/s.spd+(dy/d-s.vy/s.spd)*Math.min(1,dt*9),m=Math.hypot(nx,ny)||1;
      s.vx=nx/m*s.spd;s.vy=ny/m*s.spd;
    }
    s.x+=s.vx*dt;s.y+=s.vy*dt;s.life-=dt;
    if(s.life<=0||s.y>WORLD_H+50){s.dead=true;continue}
    if(B.on&&!s.home&&s.col==='#5ef2ff'&&B.stored<8&&d2(s.x,s.y,B.x,B.y)<(B.r-10)*(B.r-10)){
      s.stored=true;B.stored++;A.freeze();burst(s.x,s.y,4,'#ffffff',40,.3,0);continue}
    if(solidAt(s.x,s.y)){s.dead=true;burst(s.x,s.y,5,s.col,70,.25,0);continue}
    for(const e of ENS){
      if(e.hp<=0)continue;
      if(d2(s.x,s.y,e.x,cyOf(e))<(e.r+4)*(e.r+4)){damageEnemy(e,s.dmg);s.dead=true;burst(s.x,s.y,6,s.col,90,.3,0);break}
    }
  }
  spikes=spikes.filter(s=>!s.dead);
}
function updateWorld(dw){
  if(!BOSS.active)wallX+=9*dw;
  A.setWall(clamp(1-(P.x-wallX)/500,0,1));
  if(P.dead<=0&&P.x+P.w*.5<wallX)die('freeze');
  for(const sp of spawners){
    if(P.x<sp.x1-600||P.x>sp.x2+120)continue;
    sp.t-=dw;
    if(sp.t<=0){
      sp.t=sp.period;const lane=sp.lanes[sp.k++%sp.lanes.length];
      let busy=false;for(const d of debris)if(d.fz&&Math.abs(d.x+d.w/2-lane)<10)busy=true;
      if(!busy)debris.push({x:lane-34,y:sp.y,w:68,h:26,vy:0,fz:false});
    }
  }
  for(const d of debris){
    if(d.fz&&!B.on)d.fz=false;
    if(d.fz)continue;
    d.vy+=420*dw;d.y+=d.vy*dw;
    if(B.on&&d.y>=B.floorY-2&&d2(d.x+d.w/2,d.y+d.h/2,B.x,B.y)<B.r*B.r){
      if(d.y-B.floorY<24)d.y=B.floorY;d.fz=true;d.vy=0;A.freeze();burst(d.x+d.w/2,d.y,8,'#ffffff',60,.3,0);continue}
    if(P.dead<=0&&d.vy>80&&ov(P,d)){hurt(18);d.vy=0}
  }
  debris=debris.filter(d=>d.y<WORLD_H+80);
  for(const d of drones){
    if(d.hp<=0)continue;
    d.hit=Math.max(0,d.hit-dw);
    d.fz=B.on&&d2(d.x,d.y,B.x,B.y)<B.r*B.r;
    if(d.fz)continue;
    d.t+=dw;
    const dist=P.x-d.x,act=Math.abs(dist)<470&&P.dead<=0;
    if(act){const want=clamp(P.x-Math.sign(dist||1)*210,d.hx-150,d.hx+150);d.x+=clamp(want-d.x,-1,1)*45*dw}
    d.y=d.hy+Math.sin(d.t*2)*10;
    d.cd-=dw;
    if(d.cd<=0&&act){d.cd=1.8+rnd(0,.6);fireBullet(d.x,d.y+6,P.x+P.w/2,P.y+13,150);A.tele()}
  }
  for(const t of turrets){
    if(t.hp<=0)continue;
    t.hit=Math.max(0,t.hit-dw);
    t.fz=B.on&&d2(t.x,t.y,B.x,B.y)<B.r*B.r;
    if(t.fz)continue;
    const near=d2(t.x,t.y,P.x,P.y)<520*520&&P.dead<=0;
    t.ang=Math.atan2(P.y+13-t.y,P.x+6-t.x);
    t.cd-=dw;
    if(near&&t.cd<=0){
      fireBullet(t.x,t.y,P.x+P.w/2,P.y+13,175);t.burst++;
      t.cd=t.burst%3===0?1.0:.14;
    }
  }
  updateBoss(dw);
  updBullets(dw);
  for(const e of ENS)if(e.kind==='boss')e.hit=Math.max(0,e.hit);
}
function updatePickups(dt){

function stepPlay(dt){

  else if(l.cam==='b')camOverride=BOSS.x;

function advance(){
  if(!CS)return;

  if(!CS.full){CS.t=999;CS.full=true;return}
  CS.i++;

    const cb=CS.onEnd;CS=null;camOverride=null;A.hush();

function stepScene(dt){

  const l=CS.lines[CS.i];
  if(CS.black){ctx.fillStyle='#000';ctx.fillRect(0,0,W,H)}
  else{ctx.fillStyle='#000';ctx.fillRect(0,0,W,30);ctx.fillRect(0,H-96,W,96);if(CS.holo&&CS.lines[CS.i].holo)drawHolo()}
  const chars=Math.floor(CS.t*40),t=l.t.slice(0,chars);
  ctx.font='600 14px system-ui,sans-serif';
  const bw=Math.min(W-100,620),lines=wrap(l.t,bw);
  if(CS.black){
    const ty=H/2-lines.length*10;
    let n=chars;lines.forEach((ln,i)=>{const s=ln.slice(0,Math.max(0,Math.min(ln.length,n)));n-=ln.length+1;text(s,W/2,ty+i*22,15,'#bff8ff','center')});
  }else{
    const col=l.who==='ILYR'?'#ff4fd8':l.who==='KAELEN'?'#ffb347':'#5ef2ff';
    text(l.who,W/2-bw/2,H-76,11,col);
    let n=chars;lines.forEach((ln,i)=>{const s=ln.slice(0,Math.max(0,Math.min(ln.length,n)));n-=ln.length+1;text(s,W/2-bw/2,H-56+i*18,14,'#fff')});
  }
  if(CS.full&&Math.floor(time*2)%2)text('TAP ▶',W-40,H-14,10,'#5ef2ff','right');
}
function render(){
  ctx.setTransform(dpr*scale,0,0,dpr*scale,0,0);
  ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';ctx.shadowBlur=0;
  if(!P)return;
  drawSky();
  ctx.save();
  const sh=shake;ctx.translate(-Math.round(cam.x)+(sh?rnd(-sh,sh):0),-Math.round(cam.y)+(sh?rnd(-sh,sh):0));
  drawWorld();ctx.restore();
  drawFX();
  if(state==='play'||state==='pause')drawHUD();
  if(state==='scene')drawScene();
}

/* ---------------- boot ---------------- */
let last=0,acc=0;
function frame(t){
  requestAnimationFrame(frame);
  const dt=Math.min(.05,((t-last)/1000)||0);last=t;
  if(state!=='pause'&&state!=='end'){acc+=dt;let n=0;while(acc>=STEP&&n<5){update(STEP);acc-=STEP;n++}if(n>=5)acc=0}
  render();
}
$('bStart').addEventListener('click',()=>{goFull();startGame()});
$('bFull').addEventListener('click',goFull);
$('pResume').addEventListener('click',togglePause);
$('pVoice').addEventListener('click',()=>{A.voice=!A.voice;if(!A.voice)A.hush();$('pVoice').textContent='VOICE: '+(A.voice?'ON':'OFF')});
$('pSound').addEventListener('click',()=>{A.setOn(!A.on);$('pSound').textContent='SOUND: '+(A.on?'ON':'OFF')});
$('pRestart').addEventListener('click',()=>{$('pause').classList.remove('show');state='title';A.hush();startGame()});
$('eReplay').addEventListener('click',()=>{$('end').classList.remove('show');startGame()});
async function goFull(){
  try{const el=document.documentElement;
   if(!document.fullscreenElement&&el.requestFullscreen)await el.requestFullscreen({navigationUI:'hide'});
   if(screen.orientation&&screen.orientation.lock)await screen.orientation.lock('landscape');
  }catch(e){}
}
let deferred=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;$('bInstall').hidden=false});
$('bInstall').addEventListener('click',async()=>{if(deferred){deferred.prompt();try{await deferred.userChoice}catch(e){}deferred=null;$('bInstall').hidden=true}});
if('serviceWorker' in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('sw.js').catch(()=>{});
resize();newGame();
window.__chrono={update,render,newGame,startGame,get P(){return P},get S(){return S},get T(){return T},get B(){return B},get BOSS(){return BOSS},get state(){return state},set state(v){state=v},K,E,advance,get drones(){return drones},get bullets(){return bullets},get debris(){return debris},get spikes(){return spikes},bossDown,startScene,get L(){return L},get cps(){return cps}};
requestAnimationFrame(frame);
})();
</script>
